# Production/VPS note: nothing in this file publishes a port for `db`,
# `dtrack-db`, or `dependency-track` — they're reachable only from other
# containers on the compose network (by service name), never from the host
# or the internet, regardless of the host's firewall state (removing the
# `ports:` mapping means Docker never creates the host-level forwarding
# rule at all — unlike ufw, which Docker's own iptables rules are known to
# bypass). Only `api` (port 3000) is published. See `.env.example` and the
# README's "Production / VPS deployment" section before exposing this to
# the internet — in particular, override `POSTGRES_PASSWORD`,
# `BOOTSTRAP_SUPER_ADMIN_KEY`, `DTRACK_DB_PASSWORD`, and
# `DTRACK_ADMIN_PASSWORD` in a local `.env` (git-ignored), and put a
# reverse proxy with TLS in front of port 3000 — this serves plain HTTP,
# and API keys go out as bearer tokens.
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: sbomstash
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/sbomstash
      SERVER_ADDR: 0.0.0.0:3000
      RUST_LOG: info
      SIGNING_KEY_PATH: /data/.sbomstash_key
      # Dev/test convenience: persists uploaded SBOM bytes to disk (on the
      # same volume as the signing key) instead of the default in-memory
      # store, so leaves stay fetchable across `docker compose restart`
      # instead of the Postgres metadata surviving while the actual SBOM
      # content is gone. Not a substitute for the S3Store production still
      # needs.
      STORAGE_PATH: /data/sboms
      # On startup, ensures this exact `mag_<secret>` key exists as a
      # super_admin key (creating its tenant if needed) — the only way to
      # get a first usable key into a fresh deployment. Idempotent; never
      # overwrites an existing key.
      #
      # Deliberately has **no default**: a built-in fallback would be a
      # publicly-known super_admin credential for anyone who reads this
      # repo (which is exactly what the old `deadbeef-...` default was).
      # Unset means no bootstrap key is created at all — fail closed.
      # Generate one with:
      #   cargo run -p magnolia-auth --example bootstrap_key
      # and put it in `.env` (git-ignored). See `.env.example`.
      BOOTSTRAP_SUPER_ADMIN_KEY: "${BOOTSTRAP_SUPER_ADMIN_KEY:-}"
      BOOTSTRAP_TENANT_DOMAIN: "${BOOTSTRAP_TENANT_DOMAIN:-test.example}"
      BOOTSTRAP_TENANT_NAME: "${BOOTSTRAP_TENANT_NAME:-PLATFORM}"
      # Relaxes a small number of RBAC checks for local testing (currently:
      # lets an uploader-role key revoke its own manifests, not just
      # domain_admin/auditor/super_admin). Defaults to off here (unlike
      # local `cargo run`, which has no default) — set DEV_MODE=true in a
      # local-only `.env` if you rely on it for dev; never set it for an
      # internet-reachable deployment.
      DEV_MODE: "${DEV_MODE:-false}"
      # Optional, deployment-wide Dependency-Track integration (see
      # DTRACK_PLAN.md) — only takes effect when the "dtrack" profile is
      # also started (`docker compose --profile dtrack up`). DTRACK_URL
      # points at the dependency-track service below. DTRACK_API_KEY is read
      # from a local .env file (git-ignored — never commit a real key here),
      # written automatically by `scripts/bootstrap-dtrack.sh` after the
      # one-time manual bootstrap dtrack itself requires (it has no way to
      # pre-provision a key via env vars alone — see README). Defaults to
      # empty via the `:-` fallback when .env doesn't set it, which keeps
      # the integration disabled even if dependency-track is running.
      DTRACK_URL: http://dependency-track:8080
      DTRACK_API_KEY: "${DTRACK_API_KEY:-}"
      DTRACK_SYNC_INTERVAL_SECS: "${DTRACK_SYNC_INTERVAL_SECS:-600}"
      # Optional CVE-reachability analyser (the `reach` service below).
      # Presence-gated exactly like DTRACK_URL/DTRACK_API_KEY: both must be
      # set and non-empty, or the "Analyze reachability" button stays
      # disabled and nothing else changes. The default token matches the
      # `reach` service's own default so a plain `docker compose up` is
      # wired end to end; override both in a local `.env` for anything
      # reachable from another machine.
      AISE_REACH_BASE_URL: "${AISE_REACH_BASE_URL:-http://reach:3100}"
      AISE_REACH_TOKEN: "${REACH_API_TOKEN:-dev-reach-token}"
      # Background analysis for namespaces opted in with auto_analyze. Empty
      # values fall back to the built-in defaults (120 s, 2 in flight).
      REACHABILITY_AUTO_INTERVAL_SECS: "${REACHABILITY_AUTO_INTERVAL_SECS:-}"
      REACHABILITY_AUTO_MAX_IN_FLIGHT: "${REACHABILITY_AUTO_MAX_IN_FLIGHT:-}"
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - signing_key:/data

  # ---- Optional web UI (docker compose --profile frontend up) ----
  # Not started by a plain `docker compose up`, same opt-in pattern as the
  # dtrack services below — most of this project's own dev/testing has
  # been running the frontend natively instead (`cd frontend && npm start`,
  # see README's "Local Development Setup"), and a from-scratch VPS
  # deployment may not want this container at all (e.g. serving the built
  # assets from a CDN, or pointing a separately-hosted UI at this API via
  # the in-app "Server URL" override instead). nginx.conf inside the image
  # proxies `/api/` and `/health` to `http://api:3000` — the Docker service
  # name and the container's real internal port, unaffected by API_PORT
  # above (that only remaps `api`'s host-side binding) — so this needs no
  # extra configuration to reach it over the compose network.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # Baked into the built JS at image-build time (CRA doesn't read env
      # vars at container runtime) -- a change here needs
      # `docker compose build frontend`, not just a restart, to take
      # effect. Empty by default; the label under the brand only renders
      # when it's set to something.
      args:
        FRONTEND_INSTANCE_NAME: "${FRONTEND_INSTANCE_NAME:-}"
    profiles: ["frontend"]
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-4000}:80"

  # ---- Optional Dependency-Track integration (docker compose --profile dtrack up) ----
  # Not started by a plain `docker compose up` — opt-in only. See
  # DTRACK_PLAN.md for the full design and the one-time bootstrap steps.

  dtrack-db:
    image: postgres:15
    profiles: ["dtrack"]
    environment:
      POSTGRES_USER: dtrack
      POSTGRES_PASSWORD: ${DTRACK_DB_PASSWORD:-dtrack}
      POSTGRES_DB: dtrack
    volumes:
      - dtrack_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  dependency-track:
    # Pinned to a real version tag, not :latest — verify against
    # https://hub.docker.com/r/dependencytrack/apiserver/tags for a newer
    # stable release before deploying.
    image: dependencytrack/apiserver:5.0.5
    profiles: ["dtrack"]
    depends_on:
      dtrack-db:
        condition: service_healthy
    environment:
      # External-Postgres env var names for dependencytrack/apiserver 5.x —
      # v5 renamed these from the legacy alpine.database.* properties
      # (confirmed against the official upgrade guide: ALPINE_DATABASE_URL
      # -> DT_DATASOURCE_URL, ALPINE_DATABASE_USERNAME ->
      # DT_DATASOURCE_USERNAME, ALPINE_DATABASE_PASSWORD ->
      # DT_DATASOURCE_PASSWORD). v4.x needed ALPINE_DATABASE_MODE/
      # ALPINE_DATABASE_DRIVER too; v5 dropped both — the driver is now
      # inferred from the JDBC URL scheme and there's no more embedded-vs-
      # external "mode" to pick. If you pin back to a 4.x image, revert to
      # the ALPINE_DATABASE_* names (see git history) instead.
      DT_DATASOURCE_URL: jdbc:postgresql://dtrack-db:5432/dtrack
      DT_DATASOURCE_USERNAME: dtrack
      DT_DATASOURCE_PASSWORD: ${DTRACK_DB_PASSWORD:-dtrack}
    volumes:
      - dtrack_data:/data
    # dependencytrack/frontend is deliberately not included — Magnolia's
    # own UI is the intended findings surface; the dtrack web UI is only
    # useful for the one-time manual bootstrap (see README), reachable
    # directly against this service's REST API without it. No `ports:`
    # here either — `api` reaches it over the compose network by service
    # name (`http://dependency-track:8080`); if you ever need direct
    # access (e.g. to click around its own UI), add a loopback-only
    # mapping temporarily: `127.0.0.1:8080:8080` (never `8080:8080` alone
    # on an internet-facing host).

  # ---- CVE reachability evidence analyser ----
  # A standalone service (own Cargo project in `reach/`, own SQLite file,
  # own image) that AISE talks to over REST only. It is started by a plain
  # `docker compose up` because the AISE side degrades gracefully when it is
  # absent, but it does nothing until an analysis is requested.
  #
  # No `ports:` mapping: like `db` and `dependency-track`, this is reachable
  # only from other containers on the compose network. Add a loopback-only
  # mapping (`127.0.0.1:3100:3100`) if you want to poke at /docs by hand.
  reach:
    build:
      context: ./reach
      dockerfile: Dockerfile
    # `reach` refuses to bind a port unless a real test completion succeeds
    # against REACH_AI_BASE_URL (see reach/src/main.rs) — so an inference
    # server that is merely slow to come up, rather than genuinely
    # misconfigured, used to leave a permanently dead container behind: the
    # exit happens before the listener exists, so the Dockerfile's
    # HEALTHCHECK --start-period never gets a chance to cover it. Restarting
    # turns "started before ollama was warm" into a retry instead of a
    # broken deployment. A genuinely wrong REACH_AI_* still fails, visibly
    # and repeatedly, in the log.
    restart: unless-stopped
    depends_on:
      # Only meaningful when the `ollama` profile is active; compose ignores
      # a dependency on a service that is not being started, so this stays
      # correct for a hosted REACH_AI_BASE_URL too.
      ollama:
        condition: service_healthy
        required: false
    environment:
      REACH_SERVER_ADDR: 0.0.0.0:3100
      REACH_DB_PATH: /data/reach.db
      REACH_CACHE_DIR: /cache
      REACH_CACHE_MB: "${REACH_CACHE_MB:-2048}"
      # Has a dev default, unlike AISE's BOOTSTRAP_SUPER_ADMIN_KEY: this
      # token guards an analyser that holds no tenant data and no
      # credentials, and the service publishes no host port, so a
      # fail-closed default would only mean a broken button on every fresh
      # checkout. Override it in `.env` before exposing this anywhere.
      REACH_API_TOKEN: "${REACH_API_TOKEN:-dev-reach-token}"
      # Points at the `ollama` service below by default, so
      # `docker compose --profile ollama up` is a working local-model
      # deployment with no further configuration. Override to use a hosted
      # OpenAI-compatible endpoint during development.
      REACH_AI_BASE_URL: "${REACH_AI_BASE_URL:-http://ollama:11434}"
      REACH_AI_MODEL: "${REACH_AI_MODEL:-gemma3:4b}"
      REACH_AI_API_KEY: "${REACH_AI_API_KEY:-}"
      REACH_AI_TIMEOUT_SECS: "${REACH_AI_TIMEOUT_SECS:-120}"
      REACH_AI_MAX_TOKENS: "${REACH_AI_MAX_TOKENS:-1024}"
      REACH_AI_TEMPERATURE: "${REACH_AI_TEMPERATURE:-0}"
      REACH_GIT_TOKEN: "${REACH_GIT_TOKEN:-}"
      REACH_MAX_REPO_MB: "${REACH_MAX_REPO_MB:-512}"
      REACH_MAX_SITES: "${REACH_MAX_SITES:-50}"
      REACH_MAX_SCORED_SITES: "${REACH_MAX_SCORED_SITES:-5}"
      # Canned reports, no inference check at startup — for exercising the
      # UI without a model. See reach/README.md.
      REACH_TEST_MODE: "${REACH_TEST_MODE:-}"
      RUST_LOG: "${REACH_LOG:-info}"
    volumes:
      - reach_data:/data
      - reach_cache:/cache
      # Offline demo source repository (scripts/demo-repo.sh builds it from
      # demo/shop-api). Read-only: reach never writes to a source repo.
      - ./demo/.repos:/demo-repos:ro

  # ---- Optional local inference server (docker compose --profile ollama up) ----
  # The submission target: an OpenAI-compatible endpoint serving a local
  # Gemma-class model, with no hosted API involved. Opt-in because the model
  # weights are a multi-gigabyte download and a development run may prefer a
  # hosted endpoint.
  #
  # First run needs the model pulled once into the named volume:
  #   docker compose --profile ollama up -d ollama
  #   docker compose exec ollama ollama pull gemma3:4b
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama_models:/root/.ollama
    # `reach` depends on this being *healthy*, not merely started: its
    # startup check is a real generation, and a cold ollama answers the port
    # before it can answer a completion. `ollama list` is the cheapest call
    # that proves the server is actually serving.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    # No `ports:` — `reach` reaches it over the compose network by service
    # name. An inference server with no authentication of its own must not
    # be published to the host, let alone the internet.

volumes:
  db_data:
  signing_key:
  dtrack_db_data:
  dtrack_data:
  reach_data:
  reach_cache:
  ollama_models:
