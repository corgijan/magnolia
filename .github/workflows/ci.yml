# Runs every verification step from README → "Build, test and start" on each
# push and pull request. The AI evaluation runs only its deterministic half
# (--baseline-only): CI has no inference server, and the full run against
# the local model is a manual, recorded step (reach/eval/results/).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  workspace:
    name: Rust workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  reach:
    name: reach tests and baseline eval
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reach
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: reach
      # The fetcher and the eval fixtures shell out to git; give it an
      # identity so fixture commits work on a fresh runner.
      - run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - run: cargo test --locked
      - run: cargo run --locked --bin eval -- --baseline-only

  frontend:
    name: Frontend type check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # CI=true turns eslint warnings into build failures.
      - run: CI=true npx react-scripts build

  real-sboms:
    name: Real-SBOM tests against a live server
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sbomstash
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo build --locked --bin magnolia-server
      - name: Start the server
        run: |
          # A throwaway key for this run only (mag_ + 43 base64url characters).
          KEY="mag_$(openssl rand 32 | base64 | tr '+/' '-_' | tr -d '=\n')"
          echo "::add-mask::$KEY"
          echo "MAGNOLIA_TEST_API_KEY=$KEY" >> "$GITHUB_ENV"
          DATABASE_URL=postgres://postgres:postgres@localhost:5432/sbomstash \
          SERVER_ADDR=127.0.0.1:3000 \
          BOOTSTRAP_SUPER_ADMIN_KEY="$KEY" \
          SIGNING_KEY_PATH="$RUNNER_TEMP/signing_key" \
            nohup target/debug/magnolia-server > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -fs http://127.0.0.1:3000/health && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/server.log"
          exit 1
      - run: python3 tests/test_real_sboms.py
      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log"
