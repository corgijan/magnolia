server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # frontend/src/api.ts calls these as same-origin relative paths (e.g.
    # `fetch('/health')`, `/api/v1/...`) -- mirrors CRA's dev-time
    # "proxy": "http://127.0.0.1:3000" in package.json, which only applies
    # to `npm start` and has no effect on this production build.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://api:3000/health;
    }

    # SPA fallback so client-side routes don't 404 on refresh.
    location / {
        try_files $uri /index.html;
    }
}
